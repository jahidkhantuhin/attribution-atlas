name: Node.js CI

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: src
      - run: npm test -- --runInBand
        working-directory: src
      - run: npm run build
        working-directory: src
