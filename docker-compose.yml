services:
  web:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    networks:
      - attribution-atlas
    ports:
      - "${WEB_HOST_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./src:/var/www/attribution-atlas
      - attribution-atlas-node-modules:/var/www/attribution-atlas/node_modules
      - attribution-atlas-nuxt-cache:/var/www/attribution-atlas/.nuxt
    command: ["npm", "run", "dev"]
    tty: true
  nginx-server:
    restart: unless-stopped
    image: nginx:alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    links:
      - web
    ports:
      - "${NGINX_HOST_PORT}:80"
    networks:
      - attribution-atlas

networks:
  attribution-atlas:
    driver: bridge

volumes:
  attribution-atlas-node-modules:
  attribution-atlas-nuxt-cache:
